name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/.mcp.json; do
            python3 -m json.tool "$f" >/dev/null && echo "ok $f"
          done
      - name: Script tests
        run: tests/run.sh
